# ============================================
# G9 Sports Intelligence Platform
# Docker Compose - Unified Infrastructure
# ============================================

version: '3.8'

services:
  # ============================================
  # Layer 3: Neo4j Graph Database
  # ============================================
  neo4j:
    image: neo4j:5.15.0-community
    container_name: g9-neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-g9sports2024}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=1G
      - NEO4J_dbms_memory_pagecache_size=512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./layer3_memory:/import
    networks:
      - g9-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7474"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # ============================================
  # n8n Orchestrator
  # ============================================
  n8n:
    image: n8nio/n8n:latest
    container_name: g9-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-g9-sports-key-2024}
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Seoul
      # API Keys for n8n workflows
      - XAI_API_KEY=${XAI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - REDDIT_CLIENT_ID=${REDDIT_CLIENT_ID}
      - REDDIT_CLIENT_SECRET=${REDDIT_CLIENT_SECRET}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/home/node/workflows
    networks:
      - g9-network
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  # ============================================
  # Redis (Caching & Rate Limiting)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: g9-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - g9-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================
  # G9 API Server (FastAPI)
  # ============================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: g9-api
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-g9sports2024}
      - REDIS_URL=redis://redis:6379
      - XAI_API_KEY=${XAI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - REDDIT_CLIENT_ID=${REDDIT_CLIENT_ID}
      - REDDIT_CLIENT_SECRET=${REDDIT_CLIENT_SECRET}
      - G9_ENABLED_SPORTS=${G9_ENABLED_SPORTS:-NBA}
      - G9_LOG_LEVEL=${G9_LOG_LEVEL:-INFO}
    volumes:
      - ./:/app
      - ./data:/app/data
    networks:
      - g9-network
    depends_on:
      - neo4j
      - redis
    restart: unless-stopped

  # ============================================
  # Layer 1: Real-time Monitor (Background)
  # ============================================
  realtime-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: g9-realtime
    command: python -m layer1_realtime.monitor --sports NBA
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-g9sports2024}
      - REDIS_URL=redis://redis:6379
      - XAI_API_KEY=${XAI_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID_NBA=${TELEGRAM_CHAT_ID_NBA}
    volumes:
      - ./:/app
    networks:
      - g9-network
    depends_on:
      - neo4j
      - redis
    restart: unless-stopped
    profiles:
      - monitoring

networks:
  g9-network:
    driver: bridge

volumes:
  neo4j_data:
  neo4j_logs:
  n8n_data:
  redis_data:
