version: '3.8'

# G9 Monitoring Stack
# Prometheus + Grafana + Node Exporter + Metrics API

services:
  # Node Exporter (VPS 시스템 메트릭)
  node-exporter:
    image: prom/node-exporter:latest
    container_name: g9-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro

  # Prometheus (메트릭 수집)
  prometheus:
    image: prom/prometheus:latest
    container_name: g9-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'

  # Grafana (시각화)
  grafana:
    image: grafana/grafana:latest
    container_name: g9-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=g9admin2025
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana_g9_dashboard.json:/etc/grafana/provisioning/dashboards/g9_dashboard.json:ro

  # G9 Metrics API (Flask)
  metrics-api:
    build:
      context: .
      dockerfile: Dockerfile.metrics
    container_name: g9-metrics-api
    restart: unless-stopped
    ports:
      - "9101:9101"
    environment:
      - NEO4J_URI=bolt://172.17.0.1:7687
      - NEO4J_PASSWORD=nba_vultr_2025

  # Alertmanager (알림 관리)
  alertmanager:
    image: prom/alertmanager:latest
    container_name: g9-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'

volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:
