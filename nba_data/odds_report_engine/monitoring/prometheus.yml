# G9 Prometheus Configuration
# API 500회 관리 + NBA/경제 수집 모니터링

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alertmanager 설정
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["g9-alertmanager:9093"]

# 규칙 파일 (나중에 추가)
rule_files:
  - "alerts.yml"

scrape_configs:
  # G9 Flask API 메트릭 (NBA + 경제 수집)
  - job_name: "g9-api-metrics"
    static_configs:
      - targets: ["g9-metrics-api:9101"]

  # VPS 시스템 상태 (CPU, 메모리, 디스크)
  - job_name: "g9-node-exporter"
    static_configs:
      - targets: ["g9-node-exporter:9100"]

  # Prometheus 자체 메트릭
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
