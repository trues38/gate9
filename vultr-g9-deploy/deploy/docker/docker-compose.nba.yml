version: '3.8'

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: g9-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - GENERIC_TIMEZONE=Asia/Seoul
      - TZ=Asia/Seoul
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      - XAI_API_KEY=${XAI_API_KEY}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - g9_network
    deploy:
      resources:
        limits:
          memory: ${N8N_MEMORY}

  neo4j-nba:
    image: neo4j:5.15
    container_name: g9-neo4j-nba
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_NBA_USERNAME}/${NEO4J_NBA_PASSWORD}
      - NEO4J_server_memory_heap_initial__size=${NEO4J_NBA_HEAP_INIT}
      - NEO4J_server_memory_heap_max__size=${NEO4J_NBA_HEAP_MAX}
      - NEO4J_server_memory_pagecache_size=${NEO4J_NBA_PAGECACHE}
    volumes:
      - neo4j_nba_data:/data
      - neo4j_nba_logs:/logs
    networks:
      - g9_network
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "${NEO4J_NBA_USERNAME}", "-p", "${NEO4J_NBA_PASSWORD}", "RETURN 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  neo4j-economy:
    image: neo4j:5.15
    container_name: g9-neo4j-economy
    restart: unless-stopped
    ports:
      - "7475:7474"
      - "7688:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_ECONOMY_USERNAME}/${NEO4J_ECONOMY_PASSWORD}
      - NEO4J_server_memory_heap_initial__size=${NEO4J_ECO_HEAP_INIT}
      - NEO4J_server_memory_heap_max__size=${NEO4J_ECO_HEAP_MAX}
      - NEO4J_server_memory_pagecache_size=${NEO4J_ECO_PAGECACHE}
    volumes:
      - neo4j_economy_data:/data
      - neo4j_economy_logs:/logs
    networks:
      - g9_network

  flask-nba:
    build: ./flask-nba
    container_name: g9-flask-nba
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j-nba:7687
      - NEO4J_USERNAME=${NEO4J_NBA_USERNAME}
      - NEO4J_PASSWORD=${NEO4J_NBA_PASSWORD}
    networks:
      - g9_network
    depends_on:
      neo4j-nba:
        condition: service_healthy
    volumes:
      - flask_logs:/app/logs

  nba-collector:
    build: ./nba-collector
    container_name: g9-nba-collector
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - NEO4J_URI=bolt://neo4j-nba:7687
      - NEO4J_USERNAME=${NEO4J_NBA_USERNAME}
      - NEO4J_PASSWORD=${NEO4J_NBA_PASSWORD}
      - RAPIDAPI_KEY=${RAPIDAPI_KEY}
      - RAPIDAPI_PROVIDER=${RAPIDAPI_PROVIDER}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    networks:
      - g9_network
    depends_on:
      neo4j-nba:
        condition: service_healthy
    volumes:
      - collector_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  n8n_data:
  neo4j_nba_data:
  neo4j_nba_logs:
  neo4j_economy_data:
  neo4j_economy_logs:
  flask_logs:
  collector_data:

networks:
  g9_network:
    driver: bridge
